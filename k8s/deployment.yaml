apiVersion: apps/v1
kind: Deployment

metadata:
  name: portfolio-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: portfolio-app

  template:
    metadata:
      labels:
        app: portfolio-app

    spec:
      containers:
      - name: portfolio-container

        image: sudeepkumarreddyeaga/portfolio-ci-cd:latest

        ports:
        - containerPort: 80